plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.4.1'
}

// These are private implementation dependencies, not supplied by the Paper API.
tasks.jar { enabled = false }
tasks.shadowJar {
    archiveClassifier.set('')
    relocate 'com.github.benmanes.caffeine', 'net.mysterria.reporter.libs.caffeine'
    relocate 'com.google.gson', 'net.mysterria.reporter.libs.gson'
    relocate 'org.yaml.snakeyaml', 'net.mysterria.reporter.libs.yaml'
    mergeServiceFiles()
}
tasks.build { dependsOn tasks.shadowJar }

group = 'net.mysterria'
version = '1.0.0'

repositories {
    mavenCentral()

    maven {
        url = "https://repo.papermc.io/repository/maven-public/"
    }

    maven { url 'https://jitpack.io' }
    maven {
        url = "https://nexus.mysterria.net/repository/plugin-public/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")
    compileOnly("io.javalin:javalin-bundle:6.6.0")
    def coiApiJar = providers.gradleProperty('coiApiJar')
    if (coiApiJar.isPresent()) {
        def apiFile = file(coiApiJar.get())
        if (!apiFile.isFile()) throw new GradleException('COI API override is not a file')
        compileOnly files(apiFile)
    } else {
        compileOnly("dev.ua.ikeepcalm:circle-of-imagination-api:1.4.0-SNAPSHOT")
    }
    compileOnly 'io.swagger.core.v3:swagger-annotations:2.2.21'
    compileOnly("io.javalin.community.openapi:javalin-openapi-plugin:6.6.0")
    compileOnly("io.javalin.community.openapi:javalin-swagger-plugin:6.6.0")
    compileOnly("com.github.ikeepcalm:catwalk:v.0.8")
    compileOnly 'org.projectlombok:lombok:1.18.46'

    annotationProcessor("io.javalin.community.openapi:openapi-annotation-processor:6.6.0")
    annotationProcessor 'org.projectlombok:lombok:1.18.46'

    implementation 'org.yaml:snakeyaml:2.2'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'
}

def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
