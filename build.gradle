plugins {
    id 'java'
}

group = 'net.mysterria'
version = '1.1.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        url = "https://nexus.mysterria.net/repository/plugin-public/"
    }
    maven {
        url = "https://repo.incredibleplugins.com/releases"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.3.build.+")
    compileOnly("dev.ua.uaproject.catwalk:catwalk:0.9-SNAPSHOT")
    compileOnly("io.javalin:javalin:7.2.3")
    compileOnly("io.javalin.community.openapi:openapi-specification:7.2.3")
    compileOnly("com.fasterxml.jackson.core:jackson-databind:2.22.4")
    compileOnly("dev.ua.ikeepcalm:circle-of-imagination-api:1.5.2-SNAPSHOT")
    compileOnly("com.incredibleplugins:lands-api:7.27.1")

    compileOnly("org.projectlombok:lombok:1.18.48")
    annotationProcessor("org.projectlombok:lombok:1.18.48")
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(25)
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

configurations {
    testImplementation.extendsFrom compileOnly
}

dependencies {
    testImplementation(platform("org.junit:junit-bom:6.1.3"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
}

test {
    useJUnitPlatform()
    workingDir = layout.buildDirectory.dir("test-server").get().asFile
    doFirst { workingDir.mkdirs() }
}
