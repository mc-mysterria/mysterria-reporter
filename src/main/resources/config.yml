cache:
  # minutes
  player-ttl: 5
  # minutes, 0 disables the background refresh
  refresh-interval: 15
  max-player-entries: 1000

endpoints:
  player-pathway: true
  everyone-pathway: true
  beyonder-data: true
  beyonder-logs: true
  artifact: true
  balance-report: true
  bless: true
  rebirth: true

logging:
  debug-cache: false
  debug-refresh: false
